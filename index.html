              "text": "The best time for East African safaris is during the dry seasons — June to October and January to February. Gorilla trekking in Rwanda's Volcanoes National Park is available year-round, while the Great Migration in the Serengeti and Maasai Mara occurs between July and October."

            }
          },

            "@type": "Question",
            "name": "Do I need a visa to visit Rwanda?",
            "acceptedAnswer": {
              "@type": "Answer",

            }
          },

            }
          }
